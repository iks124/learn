data_path: "data/locomo.json"     # 你的 LoCoMo 文件路径
out_dir: "outputs"

vllm:
  base_url: "http://localhost:8012/v1"
  api_key: "EMPTY"
  model: "Qwen/Qwen3-VL-4B-Instruct"
  temperature: 0.0
  max_tokens: 3000

# Concat 基线：最多拼多少 token（粗略限制，按字符裁剪）
concat_max_chars: 50000

# STM：最近窗口
stm:
  last_k_turns: 150                # L0: 最近K轮
  include_last_session_summary: false  # L1: 加 last session 的 summary/observation（数据里有的话）
  max_chars: 50000

#modelscope download --model sentence-transformers/all-MiniLM-L6-v2


# LTM：RAG
ltm:
  embedding_model: "/home/shihoukun/.cache/modelscope/hub/models/sentence-transformers/all-MiniLM-L6-v2"
  top_k: 3
  max_ctx_chars: 50000            # 拼接检索片段的总长度
  index_fields: ["observation", "session_summary"]  # 用这些字段建库（更像“长期记忆痕迹”）, "observation", "session_summary"

# Hybrid：STM + LTM
hybrid:
  top_k: 2
  max_chars: 50000

eval:
  metric: "exact_match"           # 先用EM最直观；也实现了F1
  lower: true
